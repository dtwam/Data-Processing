<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>معالجة البيانات | تجربة تعليمية تفاعلية</title>
<meta name="description" content="تجربة تعليمية تفاعلية لمقرر معالجة البيانات: مشاهد متحركة، محاكاة تنفيذ كود C، اختبارات تفاعلية، ومرجع أكاديمي كامل.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@300;400;500;600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* =====================================================================
   معالجة البيانات — Design System
   Modern Academic · Premium · Intelligent · Calm · Interactive
   ===================================================================== */
:root{
  --canvas:#f5f7fa;
  --surface:#ffffff;
  --surface-2:#f0f3f7;
  --ink:#14213d;
  --ink-2:#21324f;
  --body:#24344f;
  --muted:#64768f;
  --faint:#94a3b8;
  --line:#e3e8f0;
  --line-2:#d3dbe8;
  --gold:#b08a3a;
  --gold-soft:#c9a84c;
  --gold-bg:#faf5e8;
  --navy:#1a2b4c;
  --navy-2:#253a63;
  --code-bg:#12203d;
  --ok:#2e7d32; --ok-bg:#e9f4ea; --ok-line:#bfe3c1;
  --err:#b0323b; --err-bg:#fbecec; --err-line:#f0c9cb;
  --info:#0d47a1; --info-bg:#e9f0fb; --info-line:#c2d6f0;
  --warn:#8a6500; --warn-bg:#fdf6e3; --warn-line:#ecd9a8;
  --radius:18px;
  --radius-s:12px;
  --shadow-soft:0 2px 10px rgba(20,33,61,.05);
  --shadow-lift:0 14px 34px rgba(20,33,61,.10);
  --font-sans:'IBM Plex Sans Arabic','Segoe UI',system-ui,sans-serif;
  --font-latin:'Inter','Segoe UI',system-ui,sans-serif;
  --font-mono:'JetBrains Mono','Consolas',monospace;
}

*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{
  font-family:var(--font-sans);
  background:var(--canvas);
  color:var(--body);
  font-size:18px;
  line-height:1.85;
  -webkit-font-smoothing:antialiased;
  text-rendering:optimizeLegibility;
}
::selection{background:rgba(201,168,76,.35)}
:focus-visible{outline:3px solid var(--gold-soft);outline-offset:3px;border-radius:6px}
img{max-width:100%;display:block}
button{font-family:inherit;cursor:pointer}
input,textarea,select{font-family:inherit}
code,pre,.mono{font-family:var(--font-mono)}
.latin{font-family:var(--font-latin);direction:ltr;unicode-bidi:isolate}
.dir-ltr{direction:ltr;text-align:left}

.maxw{max-width:1060px;margin-inline:auto;padding-inline:20px}
@media(max-width:768px){.maxw{padding-inline:14px}}

/* ---------- أزرار ---------- */
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:8px;
  background:var(--navy);color:#fff;border:none;border-radius:999px;
  padding:11px 26px;font-size:16px;font-weight:500;line-height:1.2;
  transition:background .22s ease,transform .12s ease,box-shadow .22s ease;
  text-decoration:none;white-space:nowrap;
}
.btn:hover{background:var(--navy-2);transform:translateY(-1px);box-shadow:var(--shadow-lift)}
.btn:active{transform:translateY(0)}
.btn.gold{background:var(--gold-soft);color:#141c2e}
.btn.gold:hover{background:var(--gold)}
.btn.outline{background:transparent;color:var(--navy);border:1.5px solid var(--navy)}
.btn.outline:hover{background:var(--navy);color:#fff}
.btn.ghost{background:var(--surface-2);color:var(--ink-2);border:1px solid var(--line)}
.btn.ghost:hover{background:#e6ebf2}
.btn.sm{padding:7px 16px;font-size:14px}
.btn:disabled{opacity:.45;cursor:not-allowed;transform:none;box-shadow:none}

.chip{
  display:inline-flex;align-items:center;gap:6px;padding:3px 14px;border-radius:999px;
  font-size:13px;font-weight:500;background:var(--surface-2);color:var(--muted);border:1px solid var(--line);
}
.chip.gold{background:var(--gold-bg);color:var(--gold);border-color:var(--gold-soft)}

/* ---------- الهيدر ---------- */
.topbar{
  position:sticky;top:0;z-index:60;background:rgba(255,255,255,.92);
  backdrop-filter:blur(10px);border-bottom:1px solid var(--line);
}
.topbar-inner{display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap;padding-block:12px}
.brand{display:flex;align-items:baseline;gap:8px;text-decoration:none;color:var(--ink)}
.brand b{font-size:21px;font-weight:700}
.brand i{font-style:normal;font-family:var(--font-latin);font-size:12px;color:var(--faint);font-weight:500}
.main-nav{display:flex;gap:4px;flex-wrap:wrap}
.main-nav a{
  text-decoration:none;color:var(--muted);font-size:15px;font-weight:500;
  padding:7px 14px;border-radius:999px;border:1px solid transparent;transition:.2s;
}
.main-nav a:hover{color:var(--ink);background:var(--surface-2)}
.main-nav a.active{color:#fff;background:var(--navy)}
.global-progress{height:4px;background:var(--line)}
.global-progress .bar{height:100%;width:0%;background:linear-gradient(90deg,var(--gold-soft),var(--gold));transition:width .5s ease}

/* ---------- صفحات عامة ---------- */
.view{animation:fadeUp .45s ease both}
@keyframes fadeUp{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.page-head{padding-block:44px 10px}
.page-head .ctx{font-size:14px;color:var(--faint);display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-bottom:10px}
.page-head .ctx a{color:var(--muted);text-decoration:none}
.page-head .ctx a:hover{color:var(--gold)}
.page-head h1{font-size:34px;line-height:1.35;color:var(--ink);font-weight:700}
.page-head h1 .hl{color:var(--gold)}
.page-head p{color:var(--muted);font-size:18px;max-width:70ch;margin-top:8px}
@media(max-width:768px){.page-head h1{font-size:26px}.page-head p{font-size:16px}}

.card{
  background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);
  box-shadow:var(--shadow-soft);
}
.card.pad{padding:24px 26px}
@media(max-width:768px){.card.pad{padding:18px 16px}}

.section-title{font-size:22px;color:var(--ink);font-weight:700;display:flex;align-items:center;gap:10px;margin:34px 0 14px}
.section-title .n{font-size:12px;color:var(--gold);font-weight:600;border:1px solid var(--gold-soft);border-radius:8px;padding:1px 8px}

/* ---------- Hero المنزل ---------- */
.home-hero{
  position:relative;overflow:hidden;border-radius:24px;background:linear-gradient(160deg,#16233f,#1f3356 55%,#27406b);
  color:#eaf0fa;padding:52px 48px;margin-top:26px;border:1px solid #2b4576;
}
.home-hero::after{
  content:"";position:absolute;inset:auto -10% -45% auto;width:58%;height:130%;
  background:radial-gradient(closest-side,rgba(201,168,76,.16),transparent 70%);
  pointer-events:none;
}
.home-hero .kicker{font-size:13px;letter-spacing:2px;color:var(--gold-soft);font-weight:600;margin-bottom:14px}
.home-hero h1{font-size:36px;line-height:1.4;font-weight:700;max-width:22ch}
.home-hero h1 .hl{color:var(--gold-soft)}
.home-hero .big-q{font-size:21px;line-height:1.7;color:#cdd9ec;max-width:60ch;margin-top:16px;font-weight:400}
.home-hero .big-q b{color:#fff}
.home-hero .acts{display:flex;gap:12px;flex-wrap:wrap;margin-top:26px}
@media(max-width:768px){
  .home-hero{padding:34px 22px}
  .home-hero h1{font-size:27px}
  .home-hero .big-q{font-size:17px}
}

.wyl{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:14px;margin-top:8px}
.wyl-item{
  background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px 18px;
  display:flex;gap:12px;align-items:flex-start;transition:.25s;
}
.wyl-item:hover{transform:translateY(-3px);box-shadow:var(--shadow-lift);border-color:var(--line-2)}
.wyl-item .ic{width:40px;height:40px;flex:none;border-radius:12px;background:var(--gold-bg);color:var(--gold);display:flex;align-items:center;justify-content:center;font-size:19px}
.wyl-item b{font-size:16px;color:var(--ink);display:block;line-height:1.5}
.wyl-item span{font-size:14px;color:var(--muted)}

/* ---------- رحلة الوحدات ---------- */
.journey-strip{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin:8px 0 4px}
.journey-node{
  display:flex;align-items:center;gap:8px;padding:8px 16px;border-radius:999px;border:1.5px solid var(--line-2);
  background:var(--surface);font-size:14px;font-weight:500;color:var(--muted);cursor:pointer;transition:.22s;
}
.journey-node:hover{border-color:var(--gold-soft);color:var(--ink)}
.journey-node .st{width:22px;height:22px;border-radius:50%;background:var(--surface-2);color:var(--muted);font-size:11px;display:flex;align-items:center;justify-content:center}
.journey-node.done .st{background:var(--ok);color:#fff}
.journey-node.cur{border-color:var(--navy);background:var(--navy);color:#fff}
.journey-node.cur .st{background:rgba(255,255,255,.16);color:#fff}
.journey-node.locked{opacity:.45;cursor:not-allowed}
.journey-link{color:var(--line-2);font-size:13px}
@media(max-width:640px){.journey-link{display:none}}

.unit-card{display:block;text-decoration:none;color:inherit;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:22px;transition:.25s;position:relative;overflow:hidden}
.unit-card:hover{transform:translateY(-4px);box-shadow:var(--shadow-lift);border-color:var(--line-2)}
.unit-card .u-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.unit-card .u-num{font-size:12px;font-weight:700;letter-spacing:1px;color:var(--gold);border:1px solid var(--gold-soft);border-radius:8px;padding:2px 9px}
.unit-card h3{font-size:20px;color:var(--ink);margin-bottom:6px}
.unit-card p{font-size:14.5px;color:var(--muted);line-height:1.7}
.unit-card .prog{margin-top:14px;height:5px;background:var(--surface-2);border-radius:6px;overflow:hidden}
.unit-card .prog .bar{height:100%;width:0;background:linear-gradient(90deg,var(--gold-soft),var(--gold));border-radius:6px;transition:width .6s ease}
.unit-card .u-foot{display:flex;justify-content:space-between;align-items:center;margin-top:12px}
.unit-card .u-count{font-size:13px;color:var(--faint)}
.grid{display:grid;gap:18px}
.grid.u{grid-template-columns:repeat(auto-fill,minmax(270px,1fr))}

/* ---------- مشاهد التعلم ---------- */
.scenes{padding-block:30px 60px}
.scene{
  position:relative;min-height:62vh;display:flex;align-items:center;
  padding:44px 0;border-bottom:1px solid var(--line-2);scroll-margin-top:90px;
}
.scene:last-child{border-bottom:none}
.scene .scene-tag{
  position:absolute;top:16px;inset-inline-start:0;font-size:12px;font-weight:700;letter-spacing:1.6px;
  color:var(--faint);display:flex;align-items:center;gap:8px;
}
.scene .scene-tag::before{content:"";width:26px;height:2px;background:var(--gold-soft);border-radius:2px}
.scene .inner{width:100%}

.reveal{opacity:0;transform:translateY(26px);transition:opacity .7s cubic-bezier(.22,.61,.36,1),transform .7s cubic-bezier(.22,.61,.36,1)}
.reveal.in{opacity:1;transform:none}

.scene-q .big{
  font-size:31px;line-height:1.55;color:var(--ink);font-weight:700;max-width:26ch;margin-bottom:14px;
}
.scene-q .big .hl{color:var(--gold)}
.scene-q .lead{font-size:19px;color:var(--muted);max-width:62ch}
@media(max-width:768px){.scene-q .big{font-size:23px}}

/* بطاقات دعم تعليمي */
.support-card{border-radius:16px;padding:22px 24px;border:1px solid var(--line);background:var(--surface);box-shadow:var(--shadow-soft)}
.support-card .lab{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:700;color:var(--info);background:var(--info-bg);border:1px solid var(--info-line);border-radius:8px;padding:2px 10px;margin-bottom:12px}
.support-card .lab.ls{color:#7a5c14;background:var(--warn-bg);border-color:var(--warn-line)}
.support-card p{font-size:18px;color:var(--body)}
.analogy-card{
  display:flex;gap:18px;align-items:flex-start;border-radius:16px;padding:22px 24px;
  background:linear-gradient(150deg,#fdf8ea,#f7f3e6);border:1px solid var(--warn-line);
}
.analogy-card .ic{font-size:28px;flex:none;margin-top:4px}
.analogy-card b{color:#6b5210;font-size:13px;display:block;letter-spacing:.5px;margin-bottom:4px}
.analogy-card p{font-size:18px;color:#4d3f14}

/* ---------- المشهد الثابت (Sticky) ---------- */
.sticky-scene{display:grid;grid-template-columns:1fr 1.05fr;gap:38px;align-items:start}
.sticky-scene .vis-panel{position:sticky;top:92px;align-self:start}
@media(max-width:920px){
  .sticky-scene{grid-template-columns:1fr;gap:22px}
  .sticky-scene .vis-panel{position:static}
}
.vis-shell{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:20px;box-shadow:var(--shadow-soft)}
.vis-shell .v-title{font-size:13px;font-weight:700;color:var(--faint);letter-spacing:1px;margin-bottom:8px;display:flex;align-items:center;gap:8px}
.vis-shell .v-controls{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:14px}
.vis-shell .v-controls .sep{flex:1}
.vis-caption{font-size:13.5px;color:var(--muted);margin-top:12px;line-height:1.7}

.walk-side .w-step{padding:16px 18px;border-inline-start:3px solid var(--line-2);margin-inline-start:8px;margin-block:10px;border-radius:0 12px 12px 0;transition:.3s}
.walk-side .w-step b{color:var(--ink);display:flex;align-items:center;gap:8px;font-size:16px;margin-bottom:2px}
.walk-side .w-step b .k{width:24px;height:24px;flex:none;border-radius:50%;background:var(--surface-2);color:var(--muted);font-size:11px;display:inline-flex;align-items:center;justify-content:center;font-weight:700}
.walk-side .w-step p{font-size:16px;color:var(--muted)}

/* ---------- فيزوالايزر التدفق ---------- */
.flowviz{display:flex;flex-direction:column;gap:0;margin-top:6px}
.flow-node{
  display:flex;align-items:center;gap:14px;padding:13px 18px;border-radius:14px;
  background:var(--surface-2);border:2px solid var(--line-2);transition:.3s;font-size:16px;font-weight:500;color:var(--ink-2);
}
.flow-node .fn{width:30px;height:30px;flex:none;border-radius:9px;background:var(--navy);color:#fff;font-size:12px;font-weight:700;display:flex;align-items:center;justify-content:center}
.flow-node.active{border-color:var(--gold);background:var(--gold-bg);color:#4d3f14;box-shadow:0 6px 18px rgba(201,168,76,.18)}
.flow-node.active .fn{background:var(--gold)}
.flow-node.done{border-color:var(--ok-line);background:var(--ok-bg)}
.flow-arrow{display:flex;align-items:center;justify-content:center;margin:2px 0;color:var(--line-2)}
.flow-arrow svg{width:20px;height:26px}
.flowviz.mono .flow-node{font-family:var(--font-mono);direction:ltr;text-align:left;font-size:14px}

/* ---------- فيزوالايزر الذاكرة ---------- */
.memviz{display:grid;gap:12px;margin-top:6px}
.mem-row{display:flex;gap:8px;flex-wrap:wrap}
.mem-box{
  border:2px solid var(--line-2);border-radius:12px;background:var(--surface);padding:8px 14px;
  text-align:center;min-width:92px;transition:.3s;
}
.mem-box .na{font-family:var(--font-mono);direction:ltr;font-size:12px;color:var(--muted);border-bottom:1px dashed var(--line-2);padding-bottom:4px;margin-bottom:4px}
.mem-box .va{font-family:var(--font-mono);direction:ltr;font-size:17px;color:var(--ink);font-weight:600;min-height:24px;text-align:center}
.mem-box.hot{border-color:var(--gold);background:var(--gold-bg)}
.mem-box.hot .na{color:var(--gold);border-color:var(--gold-soft)}
.mem-box.hot .va{color:#6b5210}
.mem-box.filled{border-color:var(--ok-line);background:var(--ok-bg)}
.mem-box .addr{font-family:var(--font-mono);direction:ltr;font-size:10px;color:var(--faint);margin-top:4px}

/* ---------- النص الأكاديمي ---------- */
.academic-block{
  position:relative;border-radius:16px;border:1px solid var(--info-line);background:var(--info-bg);
  padding:22px 26px;overflow:hidden;
}
.academic-block .ab-head{display:flex;align-items:center;gap:10px;font-size:13px;font-weight:700;color:var(--info);margin-bottom:10px}
.academic-block .ab-head svg{flex:none}
.academic-block p{font-size:17.5px;line-height:2;color:#12305f}
.academic-block .ab-src{font-size:12px;color:#5f7ab0;margin-top:12px;border-top:1px dashed var(--info-line);padding-top:10px;display:flex;gap:8px;align-items:center}
.reveal-key{
  margin-top:14px;display:inline-flex;align-items:center;gap:8px;flex-wrap:wrap;
  background:var(--surface);border:1px solid var(--info-line);border-radius:12px;padding:12px 16px;
}
.reveal-key .rk-t{font-size:13px;color:var(--info);font-weight:600}
.kw-chip{font-size:13.5px;background:var(--surface-2);border:1px solid var(--line);border-radius:999px;padding:2px 12px;color:var(--ink-2);opacity:0;transform:translateY(6px);transition:.4s}
.kw-chip.in{opacity:1;transform:none}

/* ---------- أمثلة ---------- */
.ex-grid{display:grid;gap:12px}
.ex-card{
  border:1px solid var(--line);border-radius:14px;padding:18px 20px;background:var(--surface);font-size:17px;
  border-inline-start:4px solid var(--gold-soft);
}
.ex-card .ex-ic{font-size:14px;color:var(--gold);font-weight:700;display:flex;gap:8px;align-items:center;margin-bottom:6px}
.ex-card pre{background:var(--surface-2);border-radius:10px;padding:12px 14px;margin-top:8px;font-size:13.5px;direction:ltr;text-align:left;overflow-x:auto}

/* ---------- مرجع أكاديمي (وضع القراءة) ---------- */
.ref-shell{display:grid;grid-template-columns:270px 1fr;gap:26px;align-items:start;padding-block:22px 50px}
.ref-toc{
  position:sticky;top:92px;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);
  padding:16px;max-height:calc(100vh - 120px);overflow:auto;
}
.ref-toc h4{font-size:13px;color:var(--faint);letter-spacing:1px;margin-bottom:10px}
.ref-toc a{display:block;text-decoration:none;color:var(--muted);font-size:14.5px;padding:7px 12px;border-radius:10px;border-inline-start:2px solid transparent;line-height:1.5}
.ref-toc a:hover{background:var(--surface-2);color:var(--ink)}
.ref-toc a.active{background:var(--gold-bg);color:#6b5210;border-inline-start-color:var(--gold)}
.ref-unit{margin-bottom:34px;scroll-margin-top:92px}
.ref-unit .ru-head{display:flex;align-items:center;gap:12px;margin-bottom:6px}
.ref-unit .ru-head .n{font-size:12px;font-weight:700;color:#fff;background:var(--navy);border-radius:8px;padding:3px 10px}
.ref-unit h2{font-size:26px;color:var(--ink)}
.ref-section{margin:22px 0 4px}
.ref-section h3{font-size:19px;color:var(--navy-2);border-inline-start:4px solid var(--gold-soft);padding-inline-start:12px;margin-bottom:10px}
.ref-concept{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:18px 20px;margin:12px 0}
.ref-concept h4{font-size:17px;color:var(--ink);margin-bottom:8px;display:flex;gap:8px;align-items:center}
.ref-concept p{font-size:16.5px;line-height:2;color:#1d2f50}
.ref-concept .rc-tags{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.ref-concept .rc-tags span{font-size:12px;color:var(--muted);background:var(--surface-2);border-radius:8px;padding:2px 10px}
@media(max-width:900px){.ref-shell{grid-template-columns:1fr}.ref-toc{position:static;max-height:none;margin-bottom:10px}}

/* ---------- استديو الكود ---------- */
.code-card{border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;background:var(--surface);box-shadow:var(--shadow-soft)}
.code-card .cc-head{display:flex;align-items:center;gap:10px;padding:10px 16px;background:var(--surface-2);border-bottom:1px solid var(--line);flex-wrap:wrap}
.code-card .cc-head .dots{display:flex;gap:5px}
.code-card .cc-head .dots i{width:10px;height:10px;border-radius:50%;display:block}
.code-card .cc-head .dots i:nth-child(1){background:#e05d5d}
.code-card .cc-head .dots i:nth-child(2){background:#edbd54}
.code-card .cc-head .dots i:nth-child(3){background:#5fcb6b}
.code-card .cc-head .fname{font-family:var(--font-mono);font-size:12.5px;color:var(--muted)}
.code-card .cc-head .spacer{flex:1}
.code-editor{
  width:100%;min-height:180px;border:none;background:var(--code-bg);color:#dbe6f5;
  font-family:var(--font-mono);font-size:14px;line-height:1.8;padding:16px 18px;resize:vertical;
  direction:ltr;text-align:left;tab-size:4;white-space:pre;
}
.code-editor:focus{outline:none;box-shadow:inset 0 0 0 2px var(--gold-soft)}
.console{
  background:#0b1426;color:#b9e0a2;font-family:var(--font-mono);font-size:13.5px;line-height:1.7;
  padding:14px 18px;min-height:90px;max-height:260px;overflow:auto;direction:ltr;text-align:left;white-space:pre-wrap;
  border-top:1px solid #22345a;
}
.console .o-err{color:#ff8f8f}
.console .o-out{color:#dbe6f5}
.var-table{width:100%;border-collapse:collapse;font-size:13.5px;background:#0b1426;color:#dbe6f5}
.var-table caption{font-size:11px;letter-spacing:1px;color:#5b739b;padding:8px;text-align:left;border-top:1px solid #22345a}
.var-table th,.var-table td{padding:6px 14px;text-align:left;font-family:var(--font-mono);border-top:1px solid #1b2b4d;direction:ltr}
.var-table th{color:#5b739b;font-size:11px;letter-spacing:1px}
.var-table td.new{color:var(--gold-soft)}
.stdin-lines{display:flex;flex-wrap:wrap;gap:6px;padding:10px 16px;border-top:1px solid #22345a;background:#0e1a30}
.stdin-lines .f-in{padding:4px 12px;border:1px dashed #3f5d92;border-radius:8px;color:#afc6ea;font-family:var(--font-mono);font-size:12.5px;direction:ltr;text-align:left;width:120px;background:transparent}
.stdin-lines .f-in:focus{outline:none;border-color:var(--gold-soft)}
.stdin-lines .lbl{color:#5b739b;font-size:11px;display:flex;align-items:center;gap:6px}
.trace-ctl{display:flex;gap:8px;align-items:center;padding:10px 16px;border-top:1px solid var(--line);flex-wrap:wrap;background:var(--surface-2)}
.trace-ctl .t-note{font-size:12.5px;color:var(--muted);flex:1}
.line-hl{background:rgba(201,168,76,.22);box-shadow:inset 0 0 0 2px rgba(201,168,76,.5);border-radius:4px}

/* ---------- التمارين ---------- */
.ex{
  border:1px solid var(--line);border-radius:var(--radius);background:var(--surface);overflow:hidden;box-shadow:var(--shadow-soft);
}
.ex .ex-head{display:flex;gap:10px;align-items:center;padding:16px 20px;border-bottom:1px solid var(--line);background:var(--surface-2)}
.ex .ex-head .ex-no{font-size:11px;font-weight:700;color:#fff;background:var(--navy);border-radius:8px;padding:3px 9px}
.ex .ex-head .ex-type{font-size:11px;color:var(--muted);letter-spacing:.5px;border:1px solid var(--line-2);border-radius:8px;padding:2px 8px}
.ex .ex-body{padding:20px 22px}
.ex .q-text{font-size:18px;font-weight:500;color:var(--ink);line-height:1.8;margin-bottom:14px}
.ex .q-text .mono{font-size:14px}
.opts{display:grid;gap:9px;margin-bottom:12px}
.opt{
  display:flex;gap:10px;align-items:flex-start;padding:12px 16px;border:1.5px solid var(--line-2);
  border-radius:13px;cursor:pointer;transition:.18s;background:var(--surface);font-size:16.5px;line-height:1.6;
}
.opt:hover{border-color:var(--navy);background:var(--surface-2)}
.opt .dot{width:18px;height:18px;flex:none;border-radius:50%;border:2px solid var(--line-2);margin-top:5px;transition:.18s;position:relative}
.opt.sel{border-color:var(--navy);background:#f2f6fd}
.opt.sel .dot{border-color:var(--navy);background:radial-gradient(circle,var(--navy) 40%,transparent 42%)}
.opt.ok{border-color:var(--ok-line);background:var(--ok-bg)}
.opt.bad{border-color:var(--err-line);background:var(--err-bg)}
.open-input{width:100%;min-height:96px;border:1.5px solid var(--line-2);border-radius:13px;padding:12px 16px;font-size:16px;background:var(--surface);resize:vertical;line-height:1.7}
.open-input:focus{outline:none;border-color:var(--gold-soft)}
.order-area{display:flex;gap:9px;flex-wrap:wrap}
.order-item{
  background:#eef1f6;border:1.5px solid var(--line-2);border-radius:999px;padding:7px 18px;font-size:15px;
  cursor:grab;user-select:none;transition:.15s;
}
.order-item:active{cursor:grabbing;opacity:.6}
.order-item.placed{background:var(--navy);color:#fff;border-color:var(--navy);cursor:pointer}
.hints{margin-top:6px}
.hint-btn{background:none;border:1.5px dashed var(--gold-soft);color:#7a5c14;font-size:14px;font-weight:600;border-radius:999px;padding:6px 16px;margin-inline-end:8px;transition:.2s}
.hint-btn:hover{background:var(--gold-bg)}
.hint-box{border-radius:12px;padding:13px 16px;margin-top:9px;background:var(--gold-bg);border:1px solid var(--warn-line);font-size:15.5px;color:#5d4a10;line-height:1.8}
.hint-box.out{display:none}
.fb{border-radius:12px;padding:13px 16px;margin-top:12px;font-weight:600;font-size:15.5px;line-height:1.8}
.fb.ok{background:var(--ok-bg);color:var(--ok);border:1px solid var(--ok-line)}
.fb.bad{background:var(--err-bg);color:var(--err);border:1px solid var(--err-line)}
.fb.info{background:var(--info-bg);color:var(--info);border:1px solid var(--info-line)}
.ex .ex-foot{display:flex;gap:10px;align-items:center;padding:14px 22px;border-top:1px solid var(--line);flex-wrap:wrap}
.ex .ex-foot .status{font-size:13px;color:var(--faint);flex:1}
.pred-box{border-radius:13px;border:1.5px solid var(--line-2);padding:12px 16px;font-size:16px;width:100%;background:var(--surface);text-align:left;direction:ltr;font-family:var(--font-mono)}
.pred-box:focus{outline:none;border-color:var(--gold-soft)}

/* ---------- إتقان المفهوم ---------- */
.mastery-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:14px}
.m-card{border:1px solid var(--line);border-radius:15px;padding:18px 20px;background:var(--surface)}
.m-card .m-ic{font-size:22px;margin-bottom:8px}
.m-card b{font-size:15px;color:var(--ink);display:block;margin-bottom:6px}
.m-card p{font-size:14.5px;color:var(--muted)}
.m-card.errors{border-color:var(--err-line);background:var(--err-bg)}
.m-card.errors b{color:var(--err)}
.m-card.think{border-color:var(--info-line);background:var(--info-bg)}
.m-card.think b{color:var(--info)}

/* ---------- تنقل المفاهيم ---------- */
.scene-nav{display:flex;align-items:stretch;gap:12px;margin-top:46px}
.scene-nav .sp{flex:1}
.scene-nav .nv{flex:1;display:block;text-decoration:none;border:1px solid var(--line);border-radius:16px;padding:16px 20px;background:var(--surface);transition:.22s;color:inherit}
.scene-nav .nv:hover{border-color:var(--gold-soft);box-shadow:var(--shadow-lift)}
.scene-nav .nv .l{font-size:12px;color:var(--faint);margin-bottom:4px}
.scene-nav .nv .t{font-size:16px;color:var(--ink);font-weight:600;line-height:1.5}

/* ---------- لوحة الرحلـة ---------- */
.stat-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:14px}
.stat-box{border-radius:15px;padding:18px 20px;background:var(--surface);border:1px solid var(--line)}
.stat-box .v{font-size:32px;font-weight:700;color:var(--gold)}
.stat-box .l{font-size:13.5px;color:var(--muted)}
.skills{display:flex;flex-wrap:wrap;gap:8px}
.skill-tag{background:var(--surface-2);border:1px solid var(--line);border-radius:999px;padding:5px 14px;font-size:13.5px;color:var(--ink-2)}
.skill-tag.locked{opacity:.45;color:var(--faint);text-decoration:line-through}
.skill-tag .sk{font-size:11px;color:var(--gold);margin-inline-end:5px}

/* ---------- مصطلح و بحث ---------- */
.term-item{border-bottom:1px solid var(--line);padding:16px 4px}
.term-item:last-child{border-bottom:none}
.term-item b{font-size:18px;color:var(--ink);display:block;margin-bottom:4px}
.term-item b .en{font-family:var(--font-latin);font-size:13px;color:var(--faint);margin-inline-start:8px}
.term-item p{font-size:16px;color:var(--muted)}
.term-item .wh{font-size:13px;color:var(--gold);margin-top:6px}
.search-result{border:1px solid var(--line);border-left:none;border-right:none;padding:14px 6px;display:flex;gap:12px;align-items:flex-start;justify-content:space-between}
.search-result .t{font-size:16.5px;color:var(--ink);font-weight:600}
.search-result .p{font-size:13.5px;color:var(--muted);margin-top:3px}
.search-empty{text-align:center;padding:40px;color:var(--muted)}

/* ---------- وضع القراءة المختصر (قابلية) ---------- */
p,li,.opt,.ex .q-text,.support-card p{text-wrap:pretty}
.maxw.prose{max-width:760px}

/* ---------- صفحات ثابتة (أمان/وصول) ---------- */
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0}
.footer{border-top:1px solid var(--line);margin-top:40px;padding:26px 0 44px;color:var(--faint);font-size:14px}
.footer .in{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}
.footer a{color:var(--muted);text-decoration:none}
.footer a:hover{color:var(--gold)}

/* ---------- شريط تقدم المفهوم (أعلى) ---------- */
.concept-bar{position:sticky;top:62px;z-index:50;background:rgba(255,255,255,.94);backdrop-filter:blur(10px);border-bottom:1px solid var(--line);padding:8px 0}
.concept-bar .in{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.concept-bar .cb-name{font-size:13px;color:var(--muted);display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.concept-bar .cb-name b{color:var(--ink);font-size:14px}
.cb-dots{display:flex;gap:5px}
.cb-dots .d{width:22px;height:22px;border-radius:50%;border:2px solid var(--line-2);background:var(--surface);font-size:9px;display:flex;align-items:center;justify-content:center;color:var(--faint);cursor:pointer;transition:.2s}
.cb-dots .d:hover{border-color:var(--gold-soft)}
.cb-dots .d.cur{background:var(--navy);border-color:var(--navy);color:#fff}
.cb-dots .d.done{background:var(--ok);border-color:var(--ok);color:#fff}
.cb-dots .d.locked{opacity:.4;cursor:not-allowed}

/* ---------- Reduced Motion ---------- */
@media (prefers-reduced-motion: reduce){
  html{scroll-behavior:auto}
  *,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}
  .reveal{opacity:1!important;transform:none!important}
  .kw-chip{opacity:1!important;transform:none!important}
}

/* ---------- Sticky visual scenes ---------- */
.sticky-scene{position:relative;display:grid;grid-template-columns:1.15fr .85fr;gap:26px;align-items:start;max-width:1120px;margin:0 auto}
.sticky-scene .vis-side{position:sticky;top:116px;align-self:start}
.sticky-scene .walk-side{padding-top:6px}
@media (max-width:900px){.sticky-scene{grid-template-columns:1fr}.sticky-scene .vis-side{position:static}}

/* ---------- Flow visualizer ---------- */
.flow-stage{border:1px solid var(--line);border-radius:16px;padding:14px;background:#fff;box-shadow:var(--shadow-s)}
.fnode{display:flex;align-items:center;gap:12px;padding:11px 14px;border-radius:12px;border:1px solid var(--line);background:#fff;}
.fnode.mem-node{border-color:#bfdbfe;background:#eff6ff}
.fnode.flow-node{border-color:#c7d2fe;background:#eef2ff}
.fnode.queue-node{border-color:#e9d5ff;background:#faf5ff}
.fnode .nbadge{width:26px;height:26px;border-radius:8px;background:var(--ink);color:#fff;font-size:12px;font-weight:800;display:flex;align-items:center;justify-content:center;flex:none}
.fnode .nlabel{font-weight:700;font-size:14px;color:var(--ink)}
.fnode .nmeta{font-size:12px;color:var(--mut);margin-top:2px}
.fnode.done{background:#ecfdf5;border-color:#86efac}
.fnode.done .nbadge{background:var(--ok)}
.fnode.active{box-shadow:0 0 0 3px rgba(249,115,22,.35);border-color:var(--acc)}
.fnode.active .nbadge{background:var(--acc)}
.farrow{display:flex;flex-direction:column;align-items:center;gap:3px;margin:4px 0;color:var(--mut)}
.farrow::after{content:"▾";font-size:15px;line-height:1}
.flownav{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.flownav button{flex:1;min-width:88px}
.fstep-lbl{font-size:12px;color:var(--mut);text-align:center;margin-top:8px}
.wstep{display:flex;gap:12px;padding:12px 0;border-top:1px dashed var(--line);opacity:.55;transition:opacity .3s}
.wstep.hot{opacity:1}
.wstep .ws-n{flex:none;width:26px;height:26px;border-radius:50%;background:var(--soft);color:var(--ink);font-weight:800;font-size:12px;display:flex;align-items:center;justify-content:center}
.wstep.hot .ws-n{background:var(--acc);color:#fff}
.wstep h4{margin:0 0 4px;font-size:14.5px}
.wstep p{margin:0;font-size:12.5px;color:var(--mut)}

/* ---------- Watch / Playground cards ---------- */
.code-card{border:1px solid var(--line);border-radius:16px;overflow:hidden;background:#fff;box-shadow:var(--shadow-s)}
.code-card .cc-top{display:flex;align-items:center;gap:8px;padding:10px 14px;border-bottom:1px solid var(--line);background:#fafaf9;flex-wrap:wrap}
.code-card .cc-top .mode-badge{font-size:10.5px;font-weight:800;padding:3px 9px;border-radius:999px;background:var(--acc);color:#fff}
.code-card pre.code-view{margin:0;padding:14px;background:#18181c;color:#e5e7eb;direction:ltr;text-align:left;font:13.5px/1.6 "JetBrains Mono",ui-monospace,monospace;overflow:auto;max-height:420px}
.code-card pre.code-view .ln{display:block;padding:0 6px;border-radius:4px;white-space:pre;color:#d4d4d8}
.code-card pre.code-view .ln.hot{background:#3f3f46;color:#fff;box-shadow:-2px 0 0 var(--acc) inset}
.code-card pre.code-view .ln .c-num{display:inline-block;width:26px;color:#71717a;user-select:none}
.code-card textarea.editor{direction:ltr;text-align:left;width:100%;border:0;outline:0;resize:vertical;min-height:180px;padding:14px;background:#18181c;color:#e5e7eb;font:13.5px/1.6 "JetBrains Mono",ui-monospace,monospace;font-family:inherit}
.cc-actions{display:flex;gap:8px;padding:10px 14px;border-top:1px solid var(--line);flex-wrap:wrap;align-items:center}
.cc-actions .btns{display:flex;gap:8px;flex-wrap:wrap}
.stdin-row{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--mut);flex-wrap:wrap}
.stdin-row input{direction:ltr;width:130px;font-family:ui-monospace,monospace;font-size:12.5px;padding:5px 9px;border:1px solid var(--line);border-radius:8px}
.out-panel{border-top:1px solid var(--line);padding:12px 14px;display:grid;grid-template-columns:1.1fr .9fr;gap:14px;background:#fff}
@media (max-width:800px){.out-panel{grid-template-columns:1fr}}
.out-panel h5{margin:0 0 8px;font-size:12px;color:var(--mut);display:flex;align-items:center;gap:6px}
.console-box{background:#0b0b0e;color:#d8f5df;border-radius:10px;padding:12px;min-height:64px;font:13px/1.55 ui-monospace,monospace;direction:ltr;text-align:left;white-space:pre-wrap;word-break:break-word}
table.vars-table{width:100%;border-collapse:collapse;font-size:12.5px;direction:ltr;text-align:left}
table.vars-table th{background:var(--soft);padding:6px 8px;color:var(--mut);font-size:11px}
table.vars-table td{padding:5px 8px;border-top:1px solid var(--line);font-family:ui-monospace,monospace}
table.vars-table tr.err-t td{color:var(--bad);font-weight:700}
.var-warn{font-size:11.5px;color:var(--mut);margin-top:8px}
.trace-now{margin-top:12px}
.trace-now b{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--mut);margin-bottom:5px}
.trace-now .ln-code{background:var(--soft);padding:9px 12px;border-radius:9px;font:12.5px ui-monospace,monospace;direction:ltr;text-align:left;color:var(--ink)}
.trace-pager{font-size:11.5px;color:var(--mut);display:flex;gap:8px;align-items:center}
@media (max-width:560px){.out-panel{grid-template-columns:1fr}}

/* ---------- Exercises ---------- */
.ex-card{border:1px solid var(--line);border-radius:18px;background:#fff;box-shadow:var(--shadow-s);padding:18px;margin-top:18px;transition:border-color .3s}
.ex-card.solved{border-color:#86efac}
.ex-head{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:6px}
.ex-type{font-size:10.5px;font-weight:800;letter-spacing:.4px;padding:3px 10px;border-radius:999px;background:var(--accent-soft);color:var(--acc)}
.ex-card.solved .ex-type{background:#ecfdf5;color:#059669}
.ex-head .ex-note{font-size:12px;color:var(--mut)}
.ex-q{font-size:16.5px;font-weight:800;margin:8px 0 12px;line-height:1.7}
.opts{display:flex;flex-direction:column;gap:9px}
.opt{display:flex;gap:11px;align-items:flex-start;padding:12px 14px;border:1.5px solid var(--line);border-radius:12px;cursor:pointer;background:#fff;transition:all .18s;font-size:14px;line-height:1.7}
.opt:hover{border-color:#c7c7d1;background:var(--soft)}
.opt .opt-bullet{flex:none;width:22px;height:22px;border-radius:50%;border:1.5px solid #c7c7d1;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:800;color:#9a9aa5;margin-top:1px}
.opt.sel{border-color:var(--acc);background:#fff7ed}
.opt.sel .opt-bullet{background:var(--acc);color:#fff;border-color:var(--acc)}
.opt.ok{border-color:#34d399;background:#ecfdf5}
.opt.ok .opt-bullet{background:var(--ok);color:#fff;border-color:var(--ok)}
.opt.bad{border-color:#f87171;background:#fef2f2}
.opt.bad .opt-bullet{background:var(--bad);color:#fff;border-color:var(--bad)}
.ex-foot{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:14px}
.ex-feedback{border-radius:12px;padding:12px 14px;font-size:13.5px;line-height:1.7;display:none}
.ex-feedback.show{display:block}
.ex-feedback.ok{background:#ecfdf5;color:#065f46;border:1px solid #a7f3d0}
.ex-feedback.bad{background:#fef2f2;color:#991b1b;border:1px solid #fecaca}
.hint-stack{display:flex;flex-direction:column;gap:7px;margin-top:12px}
.hint-box{display:none;padding:11px 13px;border-left:4px solid var(--acc);background:var(--accent-soft);border-radius:8px;font-size:13px;line-height:1.7;color:var(--ink)}
.hint-box.show{display:block}
.hint-box.truth-box{border-left-color:#a78bfa;background:#f5f3ff}
.sol-box{display:none;margin-top:12px;padding:13px 15px;border:1px dashed #a5b4fc;background:#f5f3ff;border-radius:12px;font-size:13.5px;line-height:1.8}
.sol-box.show{display:block}
.sol-box b{color:#5b21b6}
.tag-ls{font-size:10px;font-weight:700;letter-spacing:.5px;color:#7c3aed;background:#ede9fe;padding:2px 8px;border-radius:99px;margin-right:8px;vertical-align:middle}

/* order / open */
.order-area{display:flex;flex-direction:column;gap:9px;margin-top:6px}
.oitem{display:flex;align-items:center;gap:10px;padding:11px 13px;border:1.5px solid var(--line);border-radius:11px;cursor:grab;background:#fff;font-size:14px;line-height:1.6;user-select:none;transition:all .15s}
.oitem:hover{border-color:#a5b4fc}
.oitem.grab{border-color:var(--acc);background:#fff7ed;cursor:grabbing}
.oitem .ohandle{color:#b6b6c0;font-size:13px}
.oitem .oindex{flex:none;width:24px;height:24px;border-radius:8px;background:var(--soft);color:var(--ink);display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:800}
.oitem.ok{background:#ecfdf5;border-color:#34d399}
.oitem.ok .oindex{background:var(--ok);color:#fff}
.oitem.bad{background:#fef2f2;border-color:#f87171}
.oitem.bad .oindex{background:var(--bad);color:#fff}
.oitem.locked{opacity:.55;cursor:default}
.open-wrap textarea,.pred textarea{width:100%;border:1.5px solid var(--line);border-radius:12px;padding:12px;font-size:14px;line-height:1.8;resize:vertical;min-height:92px;background:#fff;outline:0}
.open-wrap textarea:focus,.pred textarea:focus{border-color:var(--acc)}
.pred-feedback{display:none;margin-top:12px;padding:13px 15px;border-radius:12px;font-size:13.5px;line-height:1.8}
.pred-feedback.show{display:block}
.pred-feedback.ok{background:#ecfdf5;color:#065f46;border:1px solid #a7f3d0}
.pred-feedback.warn{background:#fefce8;color:#854d0e;border:1px solid #fde68a}
.nextroll{margin-top:16px;text-align:center}
.nextroll p{font-size:13px;color:var(--mut)}

/* ---------- Learn shell ---------- */
.learn-page{max-width:1120px;margin:0 auto;padding:24px 22px 90px}
.concept-bar{position:sticky;top:66px;z-index:40;background:rgba(250,250,249,.92);backdrop-filter:blur(8px);border:1px solid var(--line);border-radius:16px;padding:11px 14px;margin-bottom:26px;display:flex;align-items:center;gap:12px;flex-wrap:wrap;box-shadow:var(--shadow-s)}
.concept-bar .crd{font-size:12px;color:var(--mut);display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.concept-bar .crd b{color:var(--ink)}
.dots{display:flex;gap:5px;align-items:center;flex-wrap:wrap}
.dot{width:26px;height:26px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:800;background:var(--soft);color:var(--mut);border:1px solid var(--line);cursor:pointer;transition:all .15s}
.dot:hover{transform:translateY(-2px)}
.dot.cur{background:var(--acc);color:#fff;border-color:var(--acc)}
.dot.done{background:#dcfce7;color:#15803d;border-color:#86efac}
.dot.locked{opacity:.35;cursor:not-allowed}
.mode-tabs{display:flex;gap:6px;background:var(--soft);padding:4px;border-radius:12px;margin-left:auto}
.mode-tabs button{border:0;background:transparent;padding:7px 14px;border-radius:9px;font-size:13px;font-weight:700;color:var(--mut);cursor:pointer;transition:all .18s}
.mode-tabs button.active{background:#fff;color:var(--ink);box-shadow:var(--shadow-s)}

.scene{margin-bottom:34px;scroll-margin-top:130px}
.scene-q .q-big{font-size:25px;line-height:1.8;font-weight:900;position:relative;padding-right:26px}
.scene-q .q-big::before{content:"";position:absolute;right:0;top:10px;bottom:10px;width:5px;border-radius:3px;background:var(--acc)}
.scene-q .q-goal{margin-top:8px;color:var(--mut);font-size:14px}
.scene-tag{display:inline-block;font-size:11px;font-weight:800;letter-spacing:.4px;color:var(--acc);background:var(--accent-soft);padding:4px 11px;border-radius:999px;margin-bottom:10px}

.analogy-card{display:grid;grid-template-columns:auto 1fr;gap:20px;padding:20px;border:1px solid var(--line);border-radius:20px;background:#fff;box-shadow:var(--shadow-s)}
.analogy-card .a-icon{width:66px;height:66px;border-radius:18px;background:var(--accent-soft);display:flex;align-items:center;justify-content:center;font-size:32px}
.analogy-card .sim{color:var(--mut);font-size:12.5px;margin-bottom:6px}
.analogy-card p{font-size:15px;line-height:2;margin:0}
@media (max-width:620px){.analogy-card{grid-template-columns:1fr}}

.examples-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:14px}
.example-card{display:flex;flex-direction:column;gap:12px;padding:18px;border:1px solid var(--line);border-radius:18px;background:#fff;box-shadow:var(--shadow-s)}
.example-card .e-top{display:flex;gap:14px;align-items:center}
.example-card .e-icon{width:52px;height:52px;border-radius:14px;background:var(--soft);display:flex;align-items:center;justify-content:center;font-size:24px;flex:none}
.example-card .e-title{font-size:16px;font-weight:800}
.example-card p.en{font-size:13.5px;line-height:2;margin:0;color:#374151}

/* ---------- Unit end ---------- */
.unit-end{border:2px dashed #a5b4fc;border-radius:24px;padding:26px;background:linear-gradient(135deg,#fdfbff,#f5f3ff);margin-top:10px}
.ue-title{font-size:22px;font-weight:900;display:flex;align-items:center;gap:10px;margin-bottom:6px}
.ue-sub{color:var(--mut);font-size:13.5px;margin-bottom:20px}
.miscon-list{display:flex;flex-direction:column;gap:10px}
.miscon{display:flex;gap:12px;align-items:flex-start;padding:13px 15px;border:1.5px solid var(--line);border-radius:13px;background:#fff;cursor:pointer;line-height:1.7;font-size:14px;transition:all .15s}
.miscon:hover{border-color:#c7d2fe}
.miscon .tf{flex:none;width:52px;text-align:center;padding:4px 0;border-radius:9px;font-weight:800;font-size:12px;background:var(--soft);color:var(--mut);margin-top:2px}
.miscon.answered .tf.t-true{background:#dcfce7;color:#15803d}
.miscon.answered .tf.t-false{background:#fee2e2;color:#b91c1c}
.miscon .mis-why{display:none;font-size:13px;color:#6d28d9;margin-top:6px;border-right:3px solid #c4b5fd;padding-right:10px}
.miscon.answered .mis-why{display:block}
.map-grid{display:flex;flex-wrap:wrap;gap:10px;margin-top:14px}
.map-chip{padding:9px 14px;border-radius:12px;background:#fff;border:1px solid var(--line);font-size:13px;font-weight:700;color:var(--ink);cursor:pointer;transition:all .15s}
.map-chip:hover{border-color:var(--acc);transform:translateY(-1px)}
.map-chip.done{background:#dcfce7;border-color:#86efac;color:#15803d}
.map-chip.cur{background:var(--acc);color:#fff;border-color:var(--acc)}
.topband{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin:2px 0 14px}
.topband h3{margin:0;font-size:18px;font-weight:900}
.ghost-btn{display:inline-flex;align-items:center;gap:7px;border:1.5px solid var(--line);background:#fff;color:var(--ink);padding:8px 14px;border-radius:11px;font-size:13px;font-weight:700;cursor:pointer;transition:all .15s}
.ghost-btn:hover{border-color:var(--acc);color:var(--acc)}
.ghost-btn.small{padding:5px 10px;font-size:12px}
.ghost-btn.on{background:var(--ink);color:#fff;border-color:var(--ink)}

/* route pages */
.page{max-width:1120px;margin:0 auto;padding:26px 22px 90px}
.page-narrow{max-width:880px}
.hero{padding:44px 30px;border-radius:28px;color:#fff;position:relative;overflow:hidden;background:linear-gradient(120deg,#131316,#3f3f46);box-shadow:var(--shadow)}
.hero h1{font-size:32px;margin:0 0 10px;line-height:1.5}
.hero p{font-size:15px;line-height:2;color:#d4d4d8;max-width:640px;margin:0}
.hero .h-actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:20px}
.journey{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-top:18px}
.jnode{padding:14px;border-radius:15px;border:1px solid var(--line);background:#fff;box-shadow:var(--shadow-s);cursor:pointer;transition:all .15s}
.jnode:hover{transform:translateY(-2px);border-color:var(--acc)}
.jnode .j-ic{font-size:22px}
.jnode .j-t{font-size:13.5px;font-weight:800;margin-top:6px}
.jnode .j-s{font-size:11.5px;color:var(--mut);margin-top:3px}
.jnode.done{background:#f0fdf4;border-color:#86efac}
.section-title{font-size:21px;font-weight:900;margin:34px 0 4px;display:flex;align-items:center;gap:10px}
.section-sub{color:var(--mut);font-size:13.5px;margin:0 0 16px}
.goals-list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:10px}
.goals-list li{display:flex;gap:12px;align-items:flex-start;line-height:1.8;font-size:14.5px}
.search-field{display:flex;gap:8px;margin:18px 0}
.search-field input{flex:1;border:1.5px solid var(--line);border-radius:12px;padding:12px 16px;font-size:15px;outline:0;background:#fff}
.search-field input:focus{border-color:var(--acc)}
.search-field button{padding:12px 20px;border-radius:12px;background:var(--ink);color:#fff;border:0;font-weight:700;cursor:pointer}
.search-slot{display:flex;flex-direction:column;gap:14px;margin-top:8px}
.sg-item{padding:16px 18px;border:1px solid var(--line);border-radius:14px;background:#fff;cursor:pointer;transition:all .15s;box-shadow:var(--shadow-s)}
.sg-item:hover{border-color:var(--acc);transform:translateY(-1px)}
.sg-item .sg-loc{font-size:11px;font-weight:800;color:var(--acc);letter-spacing:.3px}
.sg-item .sg-t{font-size:15px;font-weight:800;margin:5px 0 4px}
.sg-item .sg-x{font-size:13px;color:var(--mut);line-height:1.8}
.unit-card{display:flex;gap:18px;align-items:center;padding:18px 20px;border:1px solid var(--line);border-radius:18px;background:#fff;box-shadow:var(--shadow-s);cursor:pointer;transition:all .15s}
.unit-card:hover{transform:translateY(-2px);border-color:var(--acc)}
.unit-card .u-ic{width:60px;height:60px;border-radius:16px;background:var(--accent-soft);display:flex;align-items:center;justify-content:center;font-size:27px;flex:none}
.unit-card .u-t{font-size:17px;font-weight:900}
.unit-card .u-q{font-size:13px;color:var(--mut);line-height:1.8;margin-top:4px}
.units-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px}
.preset-group{margin-bottom:26px}
.preset-group>h4{display:flex;align-items:center;gap:8px;margin:0 0 12px;font-size:14.5px;color:var(--mut)}
.preset-group>h4 .pg-ic{font-size:18px}

/* reference */
.ref-wrap{max-width:1120px;margin:0 auto;padding:24px 22px 100px}
.toc-side{position:sticky;top:80px;max-height:calc(100vh - 120px);overflow:auto;padding-right:8px}
.toc-side .toc-u{margin-bottom:14px}
.toc-side .toc-u>button{width:100%;text-align:right;background:transparent;border:0;padding:8px 10px;border-radius:10px;font-weight:800;font-size:13.5px;cursor:pointer;color:var(--ink)}
.toc-side .toc-u>button:hover{background:var(--soft)}
.toc-side .toc-c{display:flex;flex-direction:column;gap:2px;margin:4px 0 4px 12px;border-right:2px solid var(--line);padding-right:8px}
.toc-side .toc-c button{text-align:right;background:transparent;border:0;padding:5px 10px;border-radius:8px;font-size:12.5px;color:var(--mut);cursor:pointer}
.toc-side .toc-c button:hover{color:var(--ink);background:var(--soft)}
.ref-notes{border:1px dashed #c4b5fd;border-radius:14px;padding:14px 16px;font-size:12.5px;color:#6d28d9;background:#faf5ff;margin:18px 0}
@media (max-width:880px){.toc-side{position:static;max-height:none}}

/* glossary / dashboard */
.gg-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px;margin-top:16px}
.gg-card{padding:18px;border:1px solid var(--line);border-radius:16px;background:#fff;box-shadow:var(--shadow-s);cursor:pointer;transition:all .15s}
.gg-card h4{margin:0 0 8px;font-size:15.5px}
.gg-card h4 .gg-x{font-size:10.5px;font-weight:800;color:var(--acc);background:var(--accent-soft);padding:2px 8px;border-radius:99px;margin-right:6px}
.gg-card p{margin:0;font-size:13.5px;line-height:1.9;color:#374151}
.gg-card:hover{transform:translateY(-2px);border-color:var(--acc)}
.pill{display:inline-block;font-size:11px;font-weight:800;padding:3px 10px;border-radius:99px;background:var(--soft);color:var(--ink)}
.pill.good{background:#dcfce7;color:#15803d}
.pill.empty{background:#f1f5f9;color:#94a3b8}
.stat-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin:18px 0}
.stat-card{padding:16px;border-radius:16px;border:1px solid var(--line);background:#fff;box-shadow:var(--shadow-s)}
.stat-card .st-n{font-size:28px;font-weight:900}
.stat-card .st-l{font-size:12.5px;color:var(--mut)}
.pb-track{height:13px;background:var(--soft);border-radius:99px;overflow:hidden}
.pb-fill{height:100%;background:linear-gradient(90deg,var(--acc),#f59e0b);border-radius:99px;transition:width .5s cubic-bezier(.22,1,.36,1)}
.dash-rows{display:flex;flex-direction:column;gap:12px;margin-top:18px}
.dash-row{display:grid;grid-template-columns:auto 1fr auto;gap:14px;align-items:center;padding:14px 16px;border:1px solid var(--line);border-radius:14px;background:#fff;cursor:pointer;transition:all .15s}
.dash-row:hover{border-color:var(--acc)}
.dash-row .dr-ic{font-size:22px}
.dash-row .dr-t{font-size:14px;font-weight:800}
.dash-row .dr-s{font-size:12px;color:var(--mut);margin-top:2px}
.footer-note{text-align:center;color:#a1a1aa;font-size:11.5px;padding:0 20px 30px;line-height:1.9}
.kbd{font-size:11px;background:#fff;border:1px solid var(--line);border-bottom-width:2px;border-radius:5px;padding:1px 6px;color:var(--mut)}
</style>
</head>
